<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospitals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">Hospital Finder</a>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="text-center mb-4">Available Hospitals</h2>

  <!-- 🔍 Search -->
  <input type="text" id="searchBox" class="form-control mb-4" placeholder="Search by city..." onkeyup="searchHospital()">

  <!-- 🏥 Data -->
  <div class="row" id="hospitalList"></div>
</div>

<!-- ✅ Supabase Script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>


const SUPABASE_URL = "https://fxuwoeerovxrqmvsxtdt.supabase.co.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4dXdvZWVyb3Z4cnFtdnN4dGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTI2NzQsImV4cCI6MjA5MTMyODY3NH0.imQRvb25cJrLE0z3RYj8JlM4ZHKbOtr4PBE5DYW1P4Q";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let hospitalsData = [];

// 📥 Database se data fetch
async function loadHospitals() {
  const { data, error } = await client
    .from('hospitals')
    .select('*');

  if (error) {
    console.log("Error:", error);
    return;
  }

  hospitalsData = data;
  displayHospitals(hospitalsData);
}

// 🖥️ UI me show karna
function displayHospitals(data) {
  let output = "";

  if (data.length === 0) {
    output = "<p class='text-center'>No hospitals found</p>";
  }

  data.forEach(h => {
    let color = "text-success";
    if (h.beds.toLowerCase().includes("full")) color = "text-danger";
    else if (h.beds.toLowerCase().includes("few")) color = "text-warning";

    output += `
    <div class="col-md-4">
      <div class="card shadow mb-4">
        <div class="card-body">
          <h5>${h.name}</h5>
          <p>📍 ${h.location}</p>
          <p>🛏 Beds: <span class="${color}">${h.beds}</span></p>

          <a href="details.html?name=${h.name}&location=${h.location}&beds=${h.beds}&contact=${h.contact}" 
             class="btn btn-primary w-100">
             View Details
          </a>

        </div>
      </div>
    </div>
    `;
  });

  document.getElementById("hospitalList").innerHTML = output;
}

// 🔍 Search function
function searchHospital() {
  let value = document.getElementById("searchBox").value.toLowerCase();

  let filtered = hospitalsData.filter(h =>
    h.location.toLowerCase().includes(value)
  );

  displayHospitals(filtered);
}

// 🚀 Start
loadHospitals();

</script>

</body>
</html>
