<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospital Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">Hospital Finder</a>
  </div>
</nav>

<div class="container mt-5">

  <a href="hospitals.html" class="btn btn-secondary mb-3">⬅ Back</a>

  <div class="card shadow p-4">

    <h2 id="name"></h2>

    <p><strong>📍 Location:</strong> <span id="location"></span></p>
    <p><strong>📞 Contact:</strong> <span id="contact"></span></p>

    <hr>

    <h4>Bed Availability</h4>
    <p>🛏 Beds: <span id="beds"></span></p>

    <!-- 🗺️ Google Map -->
    <h5 class="mt-4">Location Map</h5>
    <iframe id="mapFrame" width="100%" height="300"></iframe>

    <button class="btn btn-danger mt-3" onclick="alert('Ambulance on the way 🚑')">
      Emergency 🚑
    </button>

  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const name = params.get("name");
const location = params.get("location");
const beds = params.get("beds");
const contact = params.get("contact");


document.getElementById("name").innerText = name;
document.getElementById("location").innerText = location;
document.getElementById("beds").innerText = beds;
document.getElementById("contact").innerText = contact;


const mapUrl = `https://www.google.com/maps?q=${location}&output=embed`;
document.getElementById("mapFrame").src = mapUrl;

</script>

</body>
</html>
