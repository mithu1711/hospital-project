<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Add Hospital</h2>

<input id="name" class="form-control mb-2" placeholder="Hospital Name">
<input id="location" class="form-control mb-2" placeholder="Location">
<input id="beds" class="form-control mb-2" placeholder="Beds">
<input id="contact" class="form-control mb-2" placeholder="Contact">

<button class="btn btn-success" onclick="addHospital()">Add Hospital</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient("https://fxuwoeerovxrqmvsxtdt.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.....");

async function addHospital() {
  await supabase.from('hospitals').insert([
    {
      name: document.getElementById("name").value,
      location: document.getElementById("location").value,
      beds: document.getElementById("beds").value,
      contact: document.getElementById("contact").value
    }
  ]);

  alert("Hospital Added ✅");
}
</script>

</body>
</html>
